    
    - name: application setup
      include_role: 
          name: common
          tasks_from: app-setup
    
    - name: java setup 
      include_role:
          name: common
          tasks_from: java-setup

    - name: systemd setup
      include_role:
          name: common
          tasks_from: systemd-setup
    
    - name: Loading shipping data to mysql-server using MySQL client
      ansible.builtin.shell: mysql -h roboshop.mysql.anilkumarpatnana.online -uroot -pRoboShop@1 < /app/db/master-data.sql

    - name: Creating app user for cities database
      ansible.builtin.shell: mysql -h roboshop.mysql.anilkumarpatnana.online -uroot -pRoboShop@1 < /app/db/app-user.sql

    
    - name: restart systemd and service
      include_role:
          name: common
          tasks_from: restart
    
    
    
    
