
   - name: application setup
     include_role:
         name: common
         tasks_from: app-setup

   - name: python setup
     include_role:
         name: common
         tasks_from: python-setup

   - name: systemd setup
     include_role:
          name: common
          tasks_from: systemd-setup

   - name: restart systemd and service
     include_role:
          name: common
          tasks_from: restart 
   
   
   
   
