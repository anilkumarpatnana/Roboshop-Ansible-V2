   - name: Creating mongo repo file
     ansible.builtin.copy:
           src: mongo.repo
           dest: /etc/yum.repos.d/mongo.repo
   - name: Installing mongodb server
     ansible.builtin.package:
           name: mongodb-org
           state: present
   - name: Starting and enabling servcie mongod
     ansible.builtin.service:
           name: mongod
           state: started
           enabled: yes
   - name: allow remote connections
     ansible.builtin.replace:
           path: /etc/mongod.conf
           regexp: '127.0.0.1'
           replace: '0.0.0.0'
   - name: Restarting servcie mongod
     ansible.builtin.service:
           name: mongod
           state: restarted