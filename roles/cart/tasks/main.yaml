    - name: application setup
      include_role: 
        name: common
        tasks_from: app-setup 

    - name: nodejs setup
      include_role: 
        name: common
        tasks_from: nodejs 
    
    - name: systemd setup
      include_role: 
        name: common
        tasks_from: systemd-setup
    
    - name: restart systemd and service
      include_role: 
        name: common
        tasks_from: restart
    
    
    
    
    
