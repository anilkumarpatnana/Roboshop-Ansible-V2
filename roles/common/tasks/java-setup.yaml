    - name: Enabling module maven:3.9
      ansible.builtin.command: dnf module enable maven:3.9 -y

    - name: Installing maven and java25
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop:
        - maven
        - java-25-openjdk-devel
        - maven-openjdk25 # installing this so that we no need to set JAVA_HOME again
        - mysql
    - name: Set default Java version to Java 25 via alternatives
      ansible.builtin.alternatives:
        name: java
        path: /usr/lib/jvm/java-25-openjdk/bin/java

    - name: Setting up JAVA_HOME profile
      ansible.builtin.shell: |
        echo "export JAVA_HOME=/usr/lib/jvm/java-25-openjdk" > /etc/profile.d/java.sh
        echo "export PATH=\$JAVA_HOME/bin:\$PATH" >> /etc/profile.d/java.sh
      args:
        executable: /bin/bash
    - name: Build the application with Java 25
      ansible.builtin.command: mvn clean package
      args:
        chdir: /app
      environment:
        JAVA_HOME: /usr/lib/jvm/java-25-openjdk

    - name: Move built jar to root of working directory
      ansible.builtin.command: mv target/shipping.jar shipping.jar
      args:
        chdir: /app