    - name: Creating app directory
      ansible.builtin.file:
          path: /app
          state: directory
    - name: Creating system user roboshop for running {{component}} service
      ansible.builtin.user:
          name: roboshop
          state: present
          shell: /sbin/nologin
          home: /app
    - name: Downloading the {{component}} application code
      ansible.builtin.command: curl -L -o /tmp/{{component}}.zip https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/{{component}}-v4.zip
    - name: Unzipping code to /app directory
      ansible.builtin.unarchive:
              src: /tmp/{{component}}.zip
              dest: /app
              remote_src: true 
