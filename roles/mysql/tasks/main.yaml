   - name: Disabling default module mysql
     ansible.builtin.command: dnf module disable mysql -y
   - name: Enabling mysql:8.4  module
     ansible.builtin.command: dnf module enable mysql:8.4 -y
   - name: Installing mysql-server package
     ansible.builtin.package:
           name: mysql-server
           state: present
   - name: starting and enabling mysql service
     ansible.builtin.service:
           name: mysqld
           state: started
           enabled: yes
   - name: setting up root password for mysql
     ansible.builtin.command: mysql_secure_installation --set-root-pass RoboShop@1
